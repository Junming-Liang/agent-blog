<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>写作空间 · Agent Blog</title><link rel="stylesheet" href="/_assets/editor/editor.css"></head>
<body>
<aside class="sidebar"><div class="identity"><span class="mark">a</span><div><strong>Agent Blog</strong><small>你的文字，你的空间</small></div></div><button id="new-post" class="new-post">＋ 新建文章</button><div class="library-label">文章库 <span id="post-count">0</span></div><nav id="post-list" aria-label="文章列表"></nav><div id="extension-sidebar"></div><div class="sidebar-bottom"><i></i> 文件与编辑器同步</div></aside>
<main class="workspace">
<header class="topbar"><div><span class="breadcrumb" id="site-title">写作空间</span><span class="divider">/</span><span id="article-status">草稿</span></div><div class="top-actions"><button id="agent-context" class="quiet">复制给 Agent</button><a href="/" target="_blank" rel="noopener">查看博客 ↗</a></div></header>
<section class="document-head"><div class="document-eyebrow">WRITE SOMETHING WORTH KEEPING</div><input id="title" class="title" aria-label="文章标题" placeholder="给这个想法一个标题"><div class="metadata"><label>链接名<input id="slug" aria-label="文章链接名"></label><label>日期<input id="date" type="date" aria-label="文章日期"></label><label class="tag-field">标签<input id="tags" aria-label="文章标签" placeholder="用逗号分隔"></label></div><input id="description" class="description" aria-label="文章摘要" placeholder="一句话介绍这篇文章（可选）"></section>
<section class="writing-area"><div class="writing-toolbar"><div class="pane-label"><span class="active-dot"></span> 正文 <span class="muted">Markdown</span></div><div class="format-actions"><button id="insert-bold" title="加粗" aria-label="插入加粗">B</button><button id="insert-code" title="代码块" aria-label="插入代码块">&lt;/&gt;</button><button id="insert-math" title="数学公式" aria-label="插入公式">∑</button></div><div class="preview-label">阅读预览 <span>实时更新</span></div></div><div class="panes"><div id="editor" aria-label="Markdown 正文编辑器"></div><iframe id="preview" title="文章阅读预览" sandbox="allow-same-origin"></iframe></div></section>
<div id="extension-panels"></div><footer class="savebar"><div><span id="save-status" role="status" aria-live="polite">正在打开文章…</span><span id="word-count" class="muted"></span></div><div class="save-actions"><button id="reload-post" class="quiet">重新载入</button><button id="save-post" class="secondary">保存 <kbd>⌘ / Ctrl S</kbd></button><button id="publish-post" class="primary">发布文章</button></div></footer>
</main><script type="module" src="/_assets/editor/editor.js"></script></body></html>
